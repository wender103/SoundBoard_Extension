<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundBoard – Privacy Policy</title>
    <link rel="icon" href="logo.ico" type="image/x-icon">
    <style>
        /* ============================================================
           TEMA CLARO (padrão)
           ============================================================ */
        :root {
            --primary_color: #6c5ce7;
            --primary_color_dark: #6353df;
            --secondary_color: #00cec9;
            --secondary_color_dark: #07b3b0;
            --border_color: #e0e0e0;
            --switch_color: #e9e9e9;

            --background_1: #f9f9fb;
            --background_2: #f4f4f4;

            --sombra_1: 0 2px 8px transparent;

            --hover_1: #0000000d;
            --hover_bg_1: #e8e8e8;

            --text_color: #000;
            --text_color_secondary: #667;
            --text_color_terciary: rgb(108, 111, 119);
            --text_color_quaternary: #6c6f778c;
            --text_color_oposto: #fff;

            --border_radius_1: 4px;
            --transition_1: all 0.2s ease;
            --transform_1: translateX(2px);
            --fonte_1: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;

            --card_bg: #ffffff;
            --card_shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            --highlight_bg: #fff8dd;
            --highlight_border: #f0e2a5;
            --highlight_text: #4a3f0e;
            --highlight_strong: #332b08;
            --header_shadow: 0 2px 8px rgba(108, 92, 231, 0.2);
            --header_bg: #6c5ce7;
            --logo_badge_bg: #ffffff;
            --logo_badge_shadow: 0 1px 3px rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary_color: #6c8cff;
                --primary_color_dark: #5a7ae0;
                --secondary_color: #4dd0e1;
                --secondary_color_dark: #26c6da;
                --border_color: #3a3f4b;
                --switch_color: #2b2f3a;
                --background_1: #1e222b;
                --background_2: #161a22;
                --hover_1: rgba(108, 140, 255, 0.12);
                --hover_bg_1: #2a2f3c;
                --text_color: #edf2f7;
                --text_color_secondary: #a0aec0;
                --text_color_terciary: #718096;
                --text_color_quaternary: rgba(113, 128, 150, 0.5);
                --text_color_oposto: #ffffff;

                --card_bg: #232833;
                --card_shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
                --highlight_bg: #2e2a1a;
                --highlight_border: #4a4020;
                --highlight_text: #e8dfa8;
                --highlight_strong: #fff3b8;
                --header_shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
                --header_bg: #161a22;
                --logo_badge_bg: rgba(108, 140, 255, 0.12);
                --logo_badge_shadow: none;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            font-family: var(--fonte_1);
            background: var(--background_1);
            color: var(--text_color);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.25s ease, color 0.25s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header_bg);
            color: var(--text_color_oposto);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: var(--header_shadow);
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.2px;
            color: var(--text_color_oposto);
            user-select: none;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--logo_badge_bg);
            flex-shrink: 0;
            box-shadow: var(--logo_badge_shadow);
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        .header-logo svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: block;
        }

        .header-logo svg .sb-logo-square {
            fill: var(--primary_color);
            transition: fill 0.25s ease;
        }

        .header-logo svg .sb-logo-arrow {
            fill: var(--secondary_color);
            transition: fill 0.25s ease;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .lang-wrapper > svg.lang-globe {
            position: absolute;
            left: 10px;
            width: 14px;
            height: 14px;
            pointer-events: none;
            opacity: 0.85;
            color: var(--text_color_oposto);
            z-index: 1;
        }

        select#lang-selector {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: var(--text_color_oposto);
            font-family: var(--fonte_1);
            font-size: 13px;
            font-weight: 500;
            padding: 7px 30px 7px 30px;
            border-radius: var(--border_radius_1);
            cursor: pointer;
            transition: var(--transition_1);
            outline: none;
            position: relative;
            z-index: 2;
        }

        select#lang-selector:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        select#lang-selector:focus {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.55);
        }

        select#lang-selector option {
            background: #ffffff;
            color: #000;
        }

        @media (prefers-color-scheme: dark) {
            select#lang-selector option {
                background: #1e222b;
                color: #edf2f7;
            }
        }

        .lang-arrow {
            position: absolute;
            right: 10px;
            width: 10px;
            height: 10px;
            pointer-events: none;
            opacity: 0.85;
            color: var(--text_color_oposto);
            z-index: 1;
        }

        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary_color);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
            transition: color 0.25s ease;
        }

        .page-subtitle {
            font-size: 13.5px;
            color: var(--text_color_secondary);
            margin-bottom: 32px;
            transition: color 0.25s ease;
        }

        .card {
            background: var(--card_bg);
            border: 1px solid var(--border_color);
            border-radius: 8px;
            padding: 28px 32px;
            margin-bottom: 20px;
            box-shadow: var(--card_shadow);
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        section h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary_color);
            margin-bottom: 12px;
            letter-spacing: -0.1px;
            transition: color 0.25s ease;
        }

        section p {
            color: var(--text_color);
            font-size: 14.5px;
            line-height: 1.65;
            margin-bottom: 12px;
            transition: color 0.25s ease;
        }

        section p:last-child {
            margin-bottom: 0;
        }

        ul {
            list-style: none;
            padding-left: 0;
            margin: 12px 0;
        }

        ul li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 8px;
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text_color);
            transition: color 0.25s ease;
        }

        ul li::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 9px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary_color);
            opacity: 0.75;
            transition: background 0.25s ease;
        }

        .highlight {
            background: var(--highlight_bg);
            border: 1px solid var(--highlight_border);
            border-radius: 8px;
            padding: 16px 20px;
            margin: 16px 0;
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--highlight_text);
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        .highlight strong {
            color: var(--highlight_strong);
        }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--primary_color);
            color: var(--text_color_oposto);
            border-radius: var(--border_radius_1);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.15s ease;
            border: 1px solid transparent;
        }

        .contact-btn:hover {
            background: var(--primary_color_dark);
            transform: translateY(-1px);
        }

        .contact-btn.discord {
            background: #5865f2;
        }

        .contact-btn.discord:hover {
            background: #4752c4;
        }

        .contact-btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--text_color_quaternary);
            font-size: 12.5px;
            border-top: 1px solid var(--border_color);
            background: var(--background_2);
            margin-top: 40px;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        @media (max-width: 640px) {
            header {
                padding: 10px 16px;
            }

            .header-logo {
                font-size: 16px;
            }

            .logo-badge {
                width: 30px;
                height: 30px;
                border-radius: 6px;
            }

            .header-logo svg {
                width: 18px;
                height: 18px;
            }

            main {
                padding: 24px 16px 60px;
            }

            .page-title {
                font-size: 22px;
            }

            .card {
                padding: 22px 20px;
            }

            section h2 {
                font-size: 16px;
            }

            select#lang-selector {
                padding: 6px 26px 6px 26px;
                font-size: 12px;
            }

            .contact-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

        const IDIOMAS_SUPORTADOS = ['en', 'pt-BR', 'fr', 'ru', 'zh-CN', 'ja', 'es-419', 'de'];

        function normalizar_idioma(lang_raw) {
            const lang = String(lang_raw || '').toLowerCase();

            if (lang.startsWith('pt')) return 'pt-BR';
            if (lang.startsWith('zh')) return 'zh-CN';
            if (lang.startsWith('es')) return 'es-419';
            if (lang.startsWith('ja')) return 'ja';
            if (lang.startsWith('fr')) return 'fr';
            if (lang.startsWith('ru')) return 'ru';
            if (lang.startsWith('de')) return 'de';
            if (lang.startsWith('en')) return 'en';

            return 'en';
        }

        function detectar_idioma() {
            try {
                const params = new URLSearchParams(window.location.search);
                const lang_url = params.get('lang');
                if (lang_url) {
                    const normalizado = normalizar_idioma(lang_url);
                    if (IDIOMAS_SUPORTADOS.includes(normalizado)) return normalizado;
                }
            } catch (e) {}

            try {
                if (Array.isArray(navigator.languages) && navigator.languages.length > 0) {
                    return normalizar_idioma(navigator.languages[0]);
                }
            } catch (e) {}

            try {
                return normalizar_idioma(navigator.language || navigator.userLanguage || 'en');
            } catch (e) {}

            return 'en';
        }

        function aplicar_traducao(codigo_idioma) {
            const pacote = TRADUCOES[codigo_idioma] || TRADUCOES.en;

            function t(chave) {
                if (pacote && pacote[chave]) return pacote[chave];
                if (TRADUCOES.en && TRADUCOES.en[chave]) return TRADUCOES.en[chave];
                return '';
            }

            const mapa = {
                'page-title': t('page_title'),
                'page-subtitle': t('page_subtitle'),
                'intro-title': t('intro_title'),
                'intro-text': t('intro_text'),
                'data-collection-title': t('data_collection_title'),
                'data-collection-text': t('data_collection_text'),
                'data-usage-title': t('data_usage_title'),
                'usage-1': t('usage_1'),
                'usage-2': t('usage_2'),
                'usage-3': t('usage_3'),
                'highlight-text': t('highlight_text'),
                'contact-title': t('contact_title'),
                'contact-text': t('contact_text'),
                'footer-text': t('footer_text')
            };

            for (const id in mapa) {
                const el = document.getElementById(id);
                if (!el) continue;
                if (id === 'highlight-text') {
                    el.innerHTML = mapa[id];
                } else {
                    el.textContent = mapa[id];
                }
            }

            document.documentElement.lang = codigo_idioma;
            document.title = t('page_title');

            const select = document.getElementById('lang-selector');
            if (select) select.value = codigo_idioma;

            try {
                localStorage.setItem('soundboard_privacy_lang', codigo_idioma);
            } catch (e) {}
        }

        (function init() {
            let idioma = null;
            try {
                const salvo = localStorage.getItem('soundboard_privacy_lang');
                if (salvo && IDIOMAS_SUPORTADOS.includes(salvo)) {
                    idioma = salvo;
                }
            } catch (e) {}

            if (!idioma) {
                idioma = detectar_idioma();
            }

            aplicar_traducao(idioma);

            const select = document.getElementById('lang-selector');
            if (select) {
                select.addEventListener('change', (evento) => {
                    const novo_idioma = evento.target.value;
                    if (IDIOMAS_SUPORTADOS.includes(novo_idioma)) {
                        aplicar_traducao(novo_idioma);
                    }
                });
            }
        })();
    </script>
